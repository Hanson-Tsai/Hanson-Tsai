name: Generate Snake Animation

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Run on every push to the default branch (and the design branch, for previews)
  push:
    branches:
      - main
      - claude/github-profile-design-8ri88i
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00ADD8&color_dots=ebedf0,9be9a8,40c463,30a14e,216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=00ADD8&color_dots=2d333b,0e4429,006d32,26a641,39d353

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
